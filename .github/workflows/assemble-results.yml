name: Assemble reference results

on:
  push:
    branches: [main]
    paths:
      - ".artifact/results_READY"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract reference results
        shell: bash
        run: |
          set -euo pipefail
          cat .artifact/results_part_* > /tmp/results-repro.b64
          base64 --decode /tmp/results-repro.b64 > /tmp/results-repro.tar.gz
          tar -xzf /tmp/results-repro.tar.gz -C .
          rm -rf .artifact
      - name: Refresh repository manifest
        shell: bash
        run: |
          set -euo pipefail
          find analysis harness tests theory experiments third_party data results \
            -type f -print0 | sort -z | xargs -0 sha256sum > REPOSITORY_MANIFEST_SHA256.txt
      - name: Commit reference outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add reference experiment outputs [skip ci]"
          git push
